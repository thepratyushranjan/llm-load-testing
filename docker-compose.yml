services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.9
    container_name: clickhouse-db
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  api:
    build: .
    container_name: llm-load-testing-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  clickhouse_data:

networks:
  app-network:
    driver: bridge
